{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Sports Results
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>

<body>

    {% include "includes/navigation.html" %}

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container py-4 text-muted border-top">
        <p>
            Sports Results —
            <span id="current-year"></span>
        </p>
    </footer>

    <script
        src="{% static 'homepage/js/main.js' %}">
    </script>

</body>
</html>
